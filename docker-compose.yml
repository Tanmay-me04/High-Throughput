services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bench
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql   # auto-seeds on first start

  redis:
    image: redis:7
    command: ["redis-server", "--save", ""]
    ports:
      - "6379:6379"
